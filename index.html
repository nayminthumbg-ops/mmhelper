<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lesson Proofreader (Official Cloud Edition - Auto Sync)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .highlight-wrong { position: relative; cursor: pointer; }
        .tooltip {
            visibility: hidden; position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); background-color: #1f2937; color: white;
            padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap;
            opacity: 0; transition: opacity 0.2s; z-index: 10; margin-bottom: 5px;
        }
        .highlight-wrong:hover .tooltip { visibility: visible; opacity: 1; }
        .loading-dots:after {
            content: '.'; animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        /* Add a subtle animation for live sync indicator */
        .pulse-dot {
            height: 8px; width: 8px; background-color: #4ade80; border-radius: 50%; display: inline-block;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const IconCloud = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19"/><path d="M20 16.5a4.5 4.5 0 0 0-3.7-7.7"/><path d="M10.5 5.5a5.5 5.5 0 0 1 9.5 4"/><path d="M6 10a5 5 0 0 0 0 10h12"/></svg>;
        const IconSparkles = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const IconBookOpen = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.72l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;

        // --- CONSTANTS ---
        // ဆရာပေးထားသော Official Gist URL (Data Source)
        const OFFICIAL_GIST_URL = "https://gist.githubusercontent.com/nayminthumbg-ops/0649a86f4ef973297ea6342b50ab9901/raw/myanmar_dict.json";
        
        // Polling Interval in Milliseconds (10 seconds)
        const SYNC_INTERVAL = 10000; 

        // Base fallback (used only if internet is down and no cache)
        const BASE_DICTIONARY = {
            "နိတ်": "နှိပ်", "နိပ်": "နှိပ်", "ခလေး": "ကလေး", "ကျတော်": "ကျွန်တော်", 
            "ပီး": "ပြီး", "ပီးတော့": "ပြီးတော့", "နဲ": "နှင့်", "နဲ့": "နှင့်"
        };

        // Regex Suffix to prevent partial matches
        const MYANMAR_EXTENDED_CHECK = "(?![\\u102B-\\u103F\\u1031\\u1038\\u200B\\u200C\\u200D])";

        function App() {
            const [text, setText] = useState("မင်္ဂလာပါ။ ဒီနေ့ ခလေးတွေ အတွက် ကွန်ပြူတာ သင်ခန်းစာ စပါမယ်။\nပထမဆုံး This PC ကို နိတ်ဖွင့်ပါ။\nပီးရင် New Folder တည့်ဆောက်ပါ။");
            const [mistakesFound, setMistakesFound] = useState([]);
            
            // Dictionary State
            const [customDict, setCustomDict] = useState(() => {
                const saved = localStorage.getItem('mm-proofreader-dict');
                return saved ? JSON.parse(saved) : BASE_DICTIONARY;
            });

            // Settings State
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini-api-key') || "");
            
            const [showApiSettings, setShowApiSettings] = useState(false);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [isGistLoading, setIsGistLoading] = useState(false);
            const [gistStatus, setGistStatus] = useState("Connecting..."); 
            
            const [aiResponse, setAiResponse] = useState(null);
            const [activeTab, setActiveTab] = useState('editor');

            // Save Configs
            useEffect(() => { localStorage.setItem('gemini-api-key', apiKey); }, [apiKey]);
            useEffect(() => { localStorage.setItem('mm-proofreader-dict', JSON.stringify(customDict)); checkSpelling(text); }, [customDict]);

            // --- AUTO SYNC LOGIC ---
            useEffect(() => {
                // Initial Load
                loadFromGist(false); 

                // Setup Interval for Auto-Sync (Every 10 Seconds)
                const intervalId = setInterval(() => {
                    loadFromGist(false); // Silent sync
                }, SYNC_INTERVAL);

                // Cleanup on unmount
                return () => clearInterval(intervalId);
            }, []);

            useEffect(() => {
                checkSpelling(text);
            }, [text]);

            // --- GIST HANDLER ---
            const loadFromGist = async (showMessages = true) => {
                const targetUrl = OFFICIAL_GIST_URL;
                
                // Only show spinner if explicitly requested (not for background polling)
                if (showMessages) setIsGistLoading(true);
                
                try {
                    // Cache busting with timestamp to get fresh data
                    const noCacheUrl = `${targetUrl}?t=${new Date().getTime()}`;
                    
                    const response = await fetch(noCacheUrl);
                    if (!response.ok) throw new Error("Network error");
                    
                    const dict = await response.json();
                    
                    // Update state - merge with local
                    setCustomDict(prev => {
                        return {...prev, ...dict};
                    });
                    
                    setGistStatus("Live Synced");
                    if(showMessages) alert("Cloud မှ နောက်ဆုံးရ အချက်အလက်များကို ရယူပြီးပါပြီ။");
                } catch (error) {
                    console.error("Sync Error:", error);
                    setGistStatus("Sync Paused");
                    if(showMessages) alert("Data မရယူနိုင်ပါ။ အင်တာနက် လိုင်းစစ်ဆေးပါ။");
                } finally {
                    if (showMessages) setIsGistLoading(false);
                }
            };

            // --- SPELL CHECK LOGIC ---
            const checkSpelling = (inputText) => {
                let foundMistakes = [];
                Object.keys(customDict).forEach((wrongWord) => {
                    if (inputText.includes(wrongWord)) {
                        const escapedWord = wrongWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(escapedWord + MYANMAR_EXTENDED_CHECK, "gu");
                        let match;
                        while ((match = regex.exec(inputText)) !== null) {
                            foundMistakes.push({
                                wrong: wrongWord,
                                right: customDict[wrongWord],
                                index: match.index,
                            });
                        }
                    }
                });
                foundMistakes.sort((a, b) => a.index - b.index);
                setMistakesFound(foundMistakes);
            };

            const applyCorrection = (wrong, right) => {
                const escapedWord = wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escapedWord + MYANMAR_EXTENDED_CHECK, "gu");
                const newText = text.replace(regex, right);
                setText(newText);
            };

            const applyAllCorrections = () => {
                let newText = text;
                const sortedKeys = Object.keys(customDict).sort((a, b) => b.length - a.length);
                sortedKeys.forEach((wrong) => {
                    const escapedWord = wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escapedWord + MYANMAR_EXTENDED_CHECK, "gu");
                    if (regex.test(newText)) {
                        const right = customDict[wrong];
                        newText = newText.replace(regex, right);
                    }
                });
                setText(newText);
            };

            // --- AI & UI ---
            const callGeminiAI = async () => {
                if (!apiKey) {
                    alert("ကျေးဇူးပြု၍ Google API Key အရင်ထည့်သွင်းပေးပါ။");
                    setShowApiSettings(true);
                    return;
                }
                setIsAiLoading(true);
                setAiResponse(null);
                const prompt = `You are a professional Myanmar Language Editor. Correct spelling/grammar. Output ONLY corrected text. Original: ${text}`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.error) {
                         if (data.error.message.includes("Generative Language API")) {
                            throw new Error("Generative Language API ကို Enable မလုပ်ရသေးပါ။ (Settings တွင်ကြည့်ပါ)");
                         }
                         throw new Error(data.error.message);
                    }
                    setAiResponse(data.candidates[0].content.parts[0].text);
                    setActiveTab('ai-result');
                } catch (error) {
                    alert("AI Error: " + error.message);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const renderHighlightedText = () => {
                const wrongWords = Object.keys(customDict);
                if (wrongWords.length === 0) return <p className="font-myanmar">{text}</p>;
                const escapedWords = wrongWords.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                escapedWords.sort((a, b) => b.length - a.length);
                const pattern = new RegExp('(' + escapedWords.map(w => w + MYANMAR_EXTENDED_CHECK).join('|') + ')', 'gu');
                const splitText = text.split(pattern);
                return (
                    <div className="whitespace-pre-wrap leading-relaxed text-gray-800 font-myanmar">
                        {splitText.map((part, i) => {
                            if (customDict.hasOwnProperty(part)) {
                                return (
                                    <span key={i} onClick={() => applyCorrection(part, customDict[part])}
                                        className="highlight-wrong bg-red-100 text-red-600 border-b-2 border-red-400 font-bold px-1 rounded mx-0.5 hover:bg-red-200 transition-colors">
                                        {part}<span className="tooltip font-sans">ပြင်ရန်: {customDict[part]}</span>
                                    </span>
                                );
                            }
                            return <span key={i}>{part}</span>;
                        })}
                    </div>
                );
            };

            const uniqueMistakes = [...new Set(mistakesFound.map(m => m.wrong))];

            return (
                <div className="font-sans text-slate-800 pb-20 bg-gray-50">
                    <header className="bg-gradient-to-r from-blue-700 to-blue-500 text-white p-4 shadow-lg sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-white/20 rounded-lg backdrop-blur-sm"><IconBookOpen /></div>
                                <div>
                                    <h1 className="text-xl font-bold">Smart Lesson Proofreader</h1>
                                    <p className="text-blue-100 text-xs hidden sm:block">Cloud Edition (Auto Sync)</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowApiSettings(!showApiSettings)} className={`p-2 rounded-lg transition flex items-center gap-2 ${showApiSettings ? 'bg-white text-blue-600' : 'bg-blue-600 hover:bg-blue-500'}`} title="AI Settings">
                                    <IconSettings /> 
                                    <div className="flex items-center gap-1.5 bg-white/20 px-2 py-0.5 rounded">
                                        <span className={`pulse-dot ${gistStatus.includes("Error") || gistStatus.includes("Paused") ? "bg-red-400" : "bg-green-400"}`}></span>
                                        <span className="text-xs">{gistStatus}</span>
                                    </div>
                                </button>
                                <button onClick={() => {const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); alert("Copied!");}} className="flex items-center gap-2 bg-white text-blue-700 px-4 py-2 rounded-lg font-bold hover:bg-blue-50 transition shadow-lg text-sm">
                                    <IconCopy /> Copy
                                </button>
                            </div>
                        </div>
                    </header>

                    {showApiSettings && (
                        <div className="bg-slate-800 text-white p-6 shadow-inner animate-in slide-in-from-top-4">
                            <div className="max-w-6xl mx-auto">
                                <div className="mb-4 flex justify-between items-center border-b border-slate-600 pb-2">
                                    <h3 className="font-bold flex items-center gap-2"><IconSparkles className="text-yellow-400"/> AI Setup</h3>
                                    <button onClick={() => setShowApiSettings(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div>
                                    <p className="text-sm text-slate-300 mb-4">
                                        <strong>Google Gemini AI:</strong> အလိုအလျောက် ပြင်ဆင်မှုစနစ်အတွက် API Key ထည့်ပါ။
                                    </p>
                                    
                                    <div className="bg-yellow-500/10 border border-yellow-500/50 p-3 rounded mb-4 text-xs text-yellow-200 font-myanmar">
                                        <strong>⚠️ API Key လိုအပ်ချက်:</strong> 
                                        <ul className="list-disc list-inside mt-1">
                                            <li>"Generative Language API" ကို Enable လုပ်ထားသော Key ဖြစ်ရပါမည်။</li>
                                        </ul>
                                    </div>

                                    <div className="flex gap-2 max-w-xl">
                                        <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="AIza..." className="flex-1 p-2 rounded text-slate-900 text-sm focus:outline-none"/>
                                        <button onClick={() => setShowApiSettings(false)} className="bg-green-600 px-4 py-2 rounded text-sm font-bold hover:bg-green-500">Save & Close</button>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-4 pt-4 border-t border-slate-600">
                                        * Cloud Dictionary is auto-synced from Official Server.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 flex flex-col gap-4">
                            <div className="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                                <button onClick={() => setActiveTab('editor')} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${activeTab === 'editor' ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100'}`}>Editor</button>
                                <button onClick={() => setActiveTab('preview')} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${activeTab === 'preview' ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100'}`}>Highlight View</button>
                                {aiResponse && <button onClick={() => setActiveTab('ai-result')} className={`px-4 py-2 rounded-lg text-sm font-bold transition bg-purple-100 text-purple-700`}>AI Result ✨</button>}
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px] relative">
                                {isAiLoading && <div className="absolute inset-0 bg-white/80 z-20 flex flex-col items-center justify-center backdrop-blur-sm"><div className="text-4xl animate-bounce">🤖</div><p className="mt-4 text-blue-600 font-bold loading-dots">AI Checking...</p></div>}
                                {activeTab === 'editor' && <textarea className="flex-1 w-full p-8 focus:outline-none resize-none text-lg leading-loose text-slate-800 font-myanmar" placeholder="Type here..." value={text} onChange={(e) => setText(e.target.value)} spellCheck={false}/>}
                                {activeTab === 'preview' && <div className="flex-1 w-full p-8 overflow-y-auto bg-slate-50 font-myanmar text-lg leading-loose">{renderHighlightedText()}</div>}
                                {activeTab === 'ai-result' && aiResponse && <div className="flex-1 flex flex-col"><div className="bg-purple-50 p-3 text-purple-800 text-sm border-b border-purple-100 flex justify-between items-center"><button onClick={() => {setText(aiResponse); setAiResponse(null); setActiveTab('editor');}} className="bg-purple-600 text-white px-3 py-1 rounded hover:bg-purple-700 text-xs font-bold">Use This</button></div><div className="flex-1 p-8 overflow-y-auto bg-white text-lg leading-loose whitespace-pre-wrap font-myanmar">{aiResponse}</div></div>}
                            </div>

                            <button onClick={callGeminiAI} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 font-bold text-lg group">
                                <IconSparkles className="group-hover:animate-spin" /> {apiKey ? "AI Auto-Fix" : "Setup AI"}
                            </button>
                        </div>

                        <div className="flex flex-col gap-6">
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="text-slate-500 text-xs font-bold uppercase tracking-wider mb-3">Status</h3>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-sm font-myanmar">Mistakes Found:</span>
                                    <span className={`font-bold ${uniqueMistakes.length > 0 ? 'text-red-500' : 'text-green-500'}`}>{uniqueMistakes.length}</span>
                                </div>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-sm font-myanmar">Dict Source:</span>
                                    <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">Official Cloud</span>
                                </div>
                                {uniqueMistakes.length > 0 && <button onClick={applyAllCorrections} className="w-full mt-2 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-bold hover:bg-red-100 transition border border-red-100">Fix All</button>}
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 max-h-[500px]">
                                <div className="bg-slate-50 p-3 border-b border-slate-200 font-bold text-sm text-slate-700 font-myanmar">Found Words</div>
                                <div className="overflow-y-auto flex-1 p-2 space-y-2">
                                    {uniqueMistakes.length === 0 ? <div className="text-center py-8 text-slate-400"><IconCheck /><p className="text-xs mt-2 font-myanmar">No mistakes</p></div> : 
                                        uniqueMistakes.map((wrongWord, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded border border-slate-100 flex justify-between items-center shadow-sm hover:border-blue-300 transition-colors">
                                                <div className="flex flex-col font-myanmar"><span className="text-red-500 line-through text-sm">{wrongWord}</span><span className="text-green-600 font-bold text-sm">↳ {customDict[wrongWord]}</span></div>
                                                <button onClick={() => applyCorrection(wrongWord, customDict[wrongWord])} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded font-bold hover:bg-blue-100 font-myanmar">Fix</button>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
